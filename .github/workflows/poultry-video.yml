name: Create 1-minute poultry farm video
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          pip install gTTS pillow requests
      - name: Render 60-second Bengali narrated MP4
        run: python scripts/create_poultry_video.py
      - name: Verify MP4 duration and streams
        run: |
          test -s output/poultry-farm-bengali-60s.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/poultry-farm-bengali-60s.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 output/poultry-farm-bengali-60s.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/poultry-farm-bengali-60s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Bengali-Poultry-Farm-Video-60-seconds
          path: output/poultry-farm-bengali-60s.mp4
          if-no-files-found: error
